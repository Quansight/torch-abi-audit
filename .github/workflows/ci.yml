name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        # One developer-prompt equivalent for the whole job: it puts cl.exe and
        # dumpbin.exe on PATH and exports INCLUDE/LIB for the steps below. The
        # fixtures require MSVC on Windows, so failing here is deliberate.
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found; cannot locate Visual Studio" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio installation with the C++ toolset" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          $envLines = cmd /c "`"$vcvars`" >nul && set"
          if (-not $envLines) { throw "vcvars64.bat produced no environment" }
          foreach ($line in $envLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -eq 'PATH') {
                $value | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              } else {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }

      - name: Verify MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command cl, dumpbin | ForEach-Object { Write-Host "$($_.Name) -> $($_.Source)" }

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run pytest

  typecheck:
    name: typecheck (pyrefly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pyrefly check

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run zensical build --strict
        working-directory: docs
